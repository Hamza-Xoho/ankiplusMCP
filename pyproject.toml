[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ankiplusmcp"
version = "0.1.0"
requires-python = ">=3.12"
description = "Independent mechanical MCP helpers for Anki cards and lecture sources"
readme = "README.md"
license = {text = "MIT"}
dependencies = ["PyMuPDF==2.1", "pillow==13.0.0", "numpy==2.5.4", "pytesseract==0.3.13", "playwright==1.64.1", "mcp==1.30.0", "pydantic==2.14.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cards = "cards.cli:main"
ankiplusmcp = "ankiplusmcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cards" = ["templates/review/*.md", "templates/review/*/*.md", "assets/coldrecall-cloze/*"]
"cards.meter" = ["prices.toml"]
"ankiplusmcp" = ["guidance/*.md"]
