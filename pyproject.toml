[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ankiplusmcp"
version = "0.3.0"
requires-python = ">=3.12"
description = "Independent mechanical MCP helpers for Anki cards and lecture sources"
readme = "README.md"
license = {text = "MIT"}
dependencies = ["mcp~=1.30", "pydantic~=2.14", "PyMuPDF~=2.1", "pillow~=13.0", "numpy~=2.5", "platformdirs>=4.2", "filelock>=3.13"]

[project.optional-dependencies]
# OCR runs the system `tesseract` program directly, so it needs no Python package.
# The extra is kept so `ankiplusmcp[ocr]` stays a valid install target.
ocr = []
render = ["playwright~=1.64"]
all = ["ankiplusmcp[ocr,render]"]
dev = ["ankiplusmcp[all]", "pytest>=8", "build"]

[project.scripts]
cards = "cards.cli:main"
ankiplusmcp = "ankiplusmcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cards" = ["templates/review/*.md", "templates/review/*/*.md", "assets/coldrecall-cloze/*"]
"cards.meter" = ["prices.toml"]
"ankiplusmcp" = ["guidance/*.md"]
