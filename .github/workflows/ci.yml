name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: No personal paths or emails in tracked files
        run: python scripts/check_privacy.py
      - name: Launcher and Python versions agree
        run: python scripts/check_versions.py

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Contract tests that need private lecture PDFs skip instead of failing
      # in public CI. Local runs still fail loudly when a fixture is missing.
      CARDS_PUBLIC_CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install Tesseract (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - name: Install Tesseract (macOS)
        if: runner.os == 'macOS'
        run: brew install tesseract
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m playwright install --with-deps chromium
      - name: Unit tests
        run: python -m pytest -q tests/unit
      - name: MCP tools and stdio integration
        run: python -m pytest -q tests/mcp
      - name: Contract tests
        run: python -m pytest -q tests/contract

  launcher:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["18", "22"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v5
      - name: Launcher unit tests
        run: npm test
      - name: Install Tesseract (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - name: Install Tesseract (macOS)
        if: runner.os == 'macOS'
        run: brew install tesseract
      - name: Build the wheel and the npm package
        run: |
          python -m pip install --upgrade pip "mcp~=1.30"
          python -m pip wheel . --no-deps -w dist
          npm pack
      - name: End to end through npx, uv and the built wheel
        run: |
          export ANKIPLUSMCP_PY_SPEC="ankiplusmcp[all] @ file://$PWD/dist/ankiplusmcp-0.2.0-py3-none-any.whl"
          # A bare path would be run as a command; --package installs the tarball.
          package="file:$PWD/ankiplusmcp-0.2.0.tgz"
          smoke="$PWD/scripts/smoke-mcp.py"
          work="$(mktemp -d)"
          cd "$work"
          npx -y --package="$package" ankiplusmcp --version
          npx -y --package="$package" ankiplusmcp setup --yes
          npx -y --package="$package" ankiplusmcp doctor
          python "$smoke" --command npx -y --package="$package" ankiplusmcp serve --workspace-root "$work/w" --source-root "$work"

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel . --no-deps -w dist
      - name: Install the wheel outside the checkout
        run: |
          python -m venv /tmp/cards-venv
          /tmp/cards-venv/bin/pip install dist/ankiplusmcp-*.whl
          /tmp/cards-venv/bin/python -c "from cards.review.packets import TEMPLATES; from cards.render import ASSETS; assert TEMPLATES.is_dir() and ASSETS.is_dir()"
      - name: Smoke test isolated build
        run: |
          work="$(mktemp -d)"
          cd "$work"
          printf 'lecture\n' > MED241_L006_smoke.txt
          /tmp/cards-venv/bin/cards state init "$work/MED241_L006_smoke.txt"
          test -f "$work/builds"/*/build.json
      - name: Refuse merged sources
        run: |
          work="$(mktemp -d)"
          cd "$work"
          printf 'lecture\n' > MED241_L029-L044_merged.txt
          if /tmp/cards-venv/bin/cards state init "$work/MED241_L029-L044_merged.txt"; then
            echo "merged source was accepted"; exit 1
          fi
